<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better CardMarket Settings</title>
    <link rel="stylesheet" href="/options.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Better CardMarket Settings</h1>
        <p class="muted">
          Customize which expansions to exclude and whether Auto list should
          auto-select expansions.
        </p>
      </header>

      <section class="card">
        <h2>Auto list behavior</h2>
        <label class="row">
          <input type="checkbox" id="autoSelectOnAutoList" />
          <span>Auto-select expansions during Auto list</span>
        </label>
      </section>

      <section class="card">
        <h2>Excluded expansions</h2>
        <p class="muted">One expansion per line.</p>
        <textarea id="excludedExpansions" rows="14"></textarea>
        <div class="actions">
          <button id="resetDefaults" type="button">Use default list</button>
          <button id="saveSettings" type="button" class="primary">Save</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/options.ts"></script>
  </body>
</html>
